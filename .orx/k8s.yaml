apiVersion: batch/v1
kind: Job
metadata:
  name: vcsd-{{ORX_RUN}}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 42000
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          resources:
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "60Gi"
            limits:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: "60Gi"
          env:
            - name: HF_HOME
              value: /workspace/hf-cache
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: cache
              mountPath: /workspace
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: cache
          emptyDir:
            sizeLimit: 40Gi
